<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff86b7">
<title>Le petit défi de Nina 🌈</title>
<style>
:root{--pink:#ff86b7;--blue:#67c8f4;--purple:#b69be9;--mint:#9fe8d7;--ink:#263d72;--paper:#fffafd}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff3f8,#effaff 55%,#fff9e8);min-height:100vh}
header{text-align:center;padding:24px 16px 18px}
h1{font-size:clamp(2rem,6vw,3.1rem);margin:0 0 8px;color:#e85c9b}
header p{margin:0 auto;max-width:620px;font-size:1.08rem;line-height:1.45}
.hero{display:block;width:min(92%,720px);max-height:240px;object-fit:cover;object-position:center 48%;margin:14px auto 0;border-radius:22px;border:5px solid white;box-shadow:0 8px 24px #6b66901a}
main{max-width:1050px;margin:auto;padding:0 14px 36px}
.topline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px}
.date{font-weight:700;background:white;padding:10px 14px;border-radius:14px;box-shadow:0 3px 12px #584c7210}
.scorebox{background:white;border-radius:18px;padding:10px 18px;text-align:center;box-shadow:0 3px 12px #584c7210}
.score{font-size:2rem;font-weight:900;color:#e85c9b}
.progress{height:10px;background:#f1dce8;border-radius:20px;overflow:hidden;margin-top:6px;width:180px;max-width:50vw}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#ff8fbd,#78d8cf);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.task{background:#fff;border:3px solid transparent;border-radius:20px;padding:15px 14px 13px;box-shadow:0 5px 16px #6b669012;transition:transform .15s,border-color .15s}
.task.done-up{border-color:#71d3a0;background:#f5fff8}
.task.done-down{border-color:#f4a2b8;background:#fff7fa}
.taskhead{display:flex;align-items:center;gap:12px}
.emoji{width:54px;height:54px;display:grid;place-items:center;background:#f5f0ff;border-radius:16px;font-size:2rem;flex-shrink:0}
.task h2{font-size:1.08rem;margin:0;line-height:1.25}
.task p{margin:6px 0 12px;color:#67759b;font-size:.88rem}
.actions{display:flex;gap:10px}
.vote{flex:1;border:0;border-radius:12px;padding:10px 8px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;transition:transform .12s;touch-action:manipulation}
.vote:active{transform:scale(.96)}
.up{background:#d8f7e4;color:#176f4b}
.down{background:#ffe0e9;color:#a33d61}
.vote[aria-pressed="true"]{outline:3px solid currentColor;outline-offset:1px}
.result{display:none;text-align:center;margin:20px 0 12px;padding:20px;background:white;border-radius:22px;box-shadow:0 5px 18px #6b669012}
.result.show{display:block}
.result h2{margin:0 0 7px;font-size:1.7rem}
.result p{margin:0;font-size:1.05rem}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.control{border:0;border-radius:14px;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer}
.primary{background:#e85c9b;color:white}.secondary{background:white;color:var(--ink);border:2px solid #e8e2f4}
.note{text-align:center;color:#737c9c;font-size:.85rem;margin:18px auto 0;max-width:620px}
#celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;display:none;z-index:10}
.confetti{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:.85}}
.firework{position:absolute;font-size:2rem;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{transform:scale(.1);opacity:0}35%{transform:scale(1.3);opacity:1}100%{transform:scale(.7) translateY(-40px);opacity:0}}
@media(max-width:480px){header{padding-top:18px}.hero{max-height:165px}.grid{grid-template-columns:1fr 1fr;gap:9px}.task{padding:11px 9px;border-radius:17px}.taskhead{gap:8px;align-items:flex-start}.emoji{width:40px;height:40px;font-size:1.5rem;border-radius:12px}.task h2{font-size:.94rem}.task p{font-size:.78rem;min-height:30px}.vote{padding:10px 4px;font-size:.9rem}.scorebox{padding:8px 12px}.progress{width:130px}}
</style>
</head>
<body>
<header>

<main>
  <div class="topline">
    <div class="date" id="dateLabel">Mon défi du jour ✨</div>
    <div class="scorebox" aria-live="polite">
      <div><span class="score" id="score">0</span> / 11 ⭐</div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
  <section class="grid" id="tasks" aria-label="Les missions du jour"></section>
  <section class="result" id="result" aria-live="polite">
    <h2 id="resultTitle"></h2><p id="resultText"></p>
  </section>
  <div class="controls">
    <button class="control primary" id="finishBtn">J’ai terminé mon défi ! 🎉</button>
    <button class="control secondary" id="resetBtn">Recommencer aujourd’hui ↻</button>
  </div>
  <p class="note">Un 👍 vaut 1 étoile. Un 👎 vaut 0 étoile — demain, tu pourras réessayer ! À partir de 6 étoiles, c’est la fête ! 🎊</p>
</main>
<div id="celebration" aria-hidden="true"></div>
<script>
const missions=[
 {name:"Se laver les mains",emoji:"🧼",hint:"Des mains propres"},
 {name:"Se brosser les dents",emoji:"🪥",hint:"Un joli sourire"},
 {name:"Prendre un bain",emoji:"🛁",hint:"Se laver et se détendre"},
 {name:"Aller aux toilettes",emoji:"🚽",hint:"Quand j’en ai besoin"},
 {name:"Manger",emoji:"🥕",hint:"Je mange mon repas"},
 {name:"Ranger",emoji:"🧸",hint:"Je range mes jouets"},
 {name:"Se coiffer",emoji:"🪮",hint:"Je prends soin de mes cheveux"},
 {name:"S’habiller",emoji:"👗",hint:"Je mets mes vêtements"},
 {name:"Mettre son pyjama",emoji:"🌙",hint:"Je me prépare pour la nuit"},
 {name:"Se préparer pour l’école",emoji:"🎒",hint:"Mon sac est prêt"},
 {name:"Aller à l’école",emoji:"🏫",hint:"Je suis prête pour apprendre"}
];
const today=new Date();
const dayKey=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
const storageKey="nina-challenge-"+dayKey;
let votes=Array(missions.length).fill(null);
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved)&&saved.length===missions.length)votes=saved;}catch(e){}
const tasksEl=document.getElementById("tasks");
const scoreEl=document.getElementById("score");
const bar=document.getElementById("progressBar");
const result=document.getElementById("result");
const dateLabel=document.getElementById("dateLabel");
dateLabel.textContent="Mon défi du "+today.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
function render(){
 tasksEl.innerHTML="";
 missions.forEach((m,i)=>{
  const card=document.createElement("article");card.className="task"+(votes[i]===true?" done-up":votes[i]===false?" done-down":"");
  card.innerHTML=`<div class="taskhead"><div class="emoji">${m.emoji}</div><div><h2>${i+1}. ${m.name}</h2><p>${m.hint}</p></div></div>
  <div class="actions"><button class="vote up" aria-label="Oui, j’ai fait : ${m.name}" aria-pressed="${votes[i]===true}">👍 Oui</button><button class="vote down" aria-label="Pas encore : ${m.name}" aria-pressed="${votes[i]===false}">👎 Pas encore</button></div>`;
  card.querySelector(".up").addEventListener("click",()=>setVote(i,true));
  card.querySelector(".down").addEventListener("click",()=>setVote(i,false));
  tasksEl.appendChild(card);
 });
 updateScore();
}
function setVote(i,value){votes[i]=value;localStorage.setItem(storageKey,JSON.stringify(votes));render();result.classList.remove("show");}
function getScore(){return votes.filter(v=>v===true).length}
function updateScore(){const s=getScore();scoreEl.textContent=s;bar.style.width=(s/11*100)+"%";}
function celebrate(){
 const layer=document.getElementById("celebration");layer.innerHTML="";layer.style.display="block";
 const colors=["#ff6fae","#64c9f4","#ffd45f","#a88af0","#65d6b0"];
 for(let i=0;i<100;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"%";c.style.background=colors[i%colors.length];c.style.animationDelay=(Math.random()*1.3)+"s";c.style.transform=`rotate(${Math.random()*360}deg)`;layer.appendChild(c);}
 ["🎆","✨","🎉","🌟","🎊"].forEach((e,i)=>{const s=document.createElement("span");s.className="firework";s.textContent=e;s.style.left=(10+i*18)+"%";s.style.top=(12+(i%2)*17)+"%";s.style.animationDelay=(i*.13)+"s";layer.appendChild(s);});
 setTimeout(()=>{layer.style.display="none";layer.innerHTML="";},4200);
}
document.getElementById("finishBtn").addEventListener("click",()=>{
 const s=getScore();result.classList.add("show");
 if(votes.some(v=>v===null)){document.getElementById("resultTitle").textContent="Encore quelques missions ! 💕";document.getElementById("resultText").textContent="Choisis 👍 ou 👎 pour chaque mission, puis regarde ton résultat." ;return;}
 if(s>=6){document.getElementById("resultTitle").textContent="BRAVO NINA ! 🎉🌈";document.getElementById("resultText").textContent=`Tu as gagné ${s} étoiles sur 11 ! Tu as réussi ton défi ! Tu peux être très fière de toi ! 💖`;celebrate();}
 else {document.getElementById("resultTitle").textContent="Bravo d’avoir essayé, Nina ! 💗";document.getElementById("resultText").textContent=`Tu as gagné ${s} étoile${s===1?"":"s"} sur 11. Chaque jour est une nouvelle chance de progresser. Bonne nuit ! 🌙`;}
});
document.getElementById("resetBtn").addEventListener("click",()=>{
 if(confirm("Recommencer le défi d’aujourd’hui ? Tes choix actuels seront effacés.")){votes=Array(missions.length).fill(null);localStorage.setItem(storageKey,JSON.stringify(votes));result.classList.remove("show");render();}
});
render();
</script>
</body>
</html>
